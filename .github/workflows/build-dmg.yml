name: Build DMG

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

jobs:
  dmg:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned test app
        run: |
          mkdir -p build/Teamute.app/Contents/MacOS build/Teamute.app/Contents/Resources
          cp Teamute/Info.plist build/Teamute.app/Contents/Info.plist
          cp Teamute/Teamute.icns build/Teamute.app/Contents/Resources/Teamute.icns
          swiftc -parse-as-library -framework AppKit -framework ApplicationServices -framework Carbon -framework CoreGraphics -framework ServiceManagement Teamute/Teamute.swift -o build/Teamute.app/Contents/MacOS/Teamute
          build/Teamute.app/Contents/MacOS/Teamute --self-test
          # Keep only a local ad-hoc signature so Apple-silicon Macs can run
          # the test artifact; it is neither Developer ID signed nor notarized.
          codesign --force --sign - build/Teamute.app
      - name: Package unsigned test DMG
        run: |
          mkdir -p dist
          hdiutil create -volname Teamute -srcfolder build/Teamute.app -ov -format UDZO dist/Teamute-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Teamute-unsigned-dmg
          path: dist/Teamute-unsigned.dmg

  release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "Release tag must be vX.Y.Z" >&2; exit 2; }
          [[ "$REF" == "refs/tags/$TAG" ]] || { echo "Release dispatch must run from its matching tag ref" >&2; exit 2; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git checkout --detach "$tag_commit"
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]] || { echo "Failed to check out release tag" >&2; exit 1; }
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Teamute/Info.plist)"
          [[ "$TAG" == "v$version" ]] || { echo "Tag $TAG does not match app version $version" >&2; exit 2; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build unsigned release DMG
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          zsh scripts/package-unsigned-dmg.sh "$TAG"
      - name: Attach unsigned DMG to the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          dmg="dist/Teamute-${TAG#v}-macOS-unsigned.dmg"
          checksum="$dmg.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" "$checksum" --clobber
          else
            gh release create "$TAG" "$dmg" "$checksum" --title "Teamute ${TAG#v} (unsigned)" --notes "This DMG is unsigned: it is not Developer ID signed and is not notarized. See docs/distribution.md before opening."
          fi
